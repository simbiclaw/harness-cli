kb_id: "filing-deadlines"
domain: "annual-report-submission"
anchor_level: "scope"
last_updated: "2026-07-04"
source: "Companies House official guidance"

content:
  standard_deadline: "9 months after accounting reference date for private companies"
  public_company_deadline: "6 months after accounting reference date"
  confirmation_statement: "Every 12 months, with a 14-day grace period"
  penalty_tiers:
    - period: "up to 1 month late"
      amount: "£150"
    - period: "1 to 3 months late"
      amount: "£375"
    - period: "3 to 6 months late"
      amount: "£750"
    - period: "more than 6 months late"
      amount: "£1,500"
  extension_conditions:
    - "System outage confirmed by Companies House service status page"
    - "Force majeure event with documented evidence"
    - "Medical incapacity of sole director with medical certificate"
