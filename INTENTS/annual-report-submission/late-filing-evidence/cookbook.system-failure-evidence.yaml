title: "System failure evidence — minimum acceptable standard"

guidance: >
  When a customer claims system failure prevented timely filing, the
  agent must collect at minimum: (1) the specific date and time of the
  attempted filing, (2) a description of the error encountered, and
  (3) confirmation that no alternative filing method was available.

adjustment: >
  If the agent collected all three minimum items, adjust the
  'verify-system-status' rule from 'requires-review' to 'pass'.
  If fewer than three items collected, the rule remains at its raw score.

