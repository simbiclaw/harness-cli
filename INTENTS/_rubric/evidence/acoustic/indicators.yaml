# _rubric/acoustic/indicators.yaml
# Acoustic indicator framework — 12 indicators for call quality assessment.
# Versioned rubric — the yardstick, not the measurement.

version: "1.0.0"
last_updated: "2026-07-04"
description: >
  These indicators define thresholds for acoustic feature assessment.
  Per-call measurements are facts; these thresholds are the rubric.

indicators:
  - id: "pitch-range"
    name: "Pitch range"
    description: "Acceptable F0 range for natural speech in this domain."
    unit: "Hz"
    min: 75
    max: 300
    flag_if_outside: "requires-review"

  - id: "pause-duration"
    name: "Pause duration"
    description: "Maximum acceptable pause between speaker turns."
    unit: "seconds"
    max: 5.0
    flag_if_exceeded: "requires-review"

  - id: "intensity-floor"
    name: "Intensity floor"
    description: "Minimum intensity for audible speech."
    unit: "dB"
    min: 40
    flag_if_below: "requires-review"

  - id: "speech-rate"
    name: "Speech rate"
    description: "Acceptable words per minute range."
    unit: "wpm"
    min: 80
    max: 200
    flag_if_outside: "requires-review"

  - id: "voice-quality"
    name: "Voice quality (jitter/shimmer)"
    description: "Maximum acceptable jitter and shimmer for natural speech."
    jitter_max: 0.02
    shimmer_max: 0.15
    flag_if_exceeded: "requires-review"

  - id: "turn-taking-overlap"
    name: "Turn-taking overlap"
    description: "Maximum acceptable overlapping speech duration."
    unit: "seconds"
    max: 0.5
    flag_if_exceeded: "requires-review"

  - id: "silence-ratio"
    name: "Silence ratio"
    description: "Maximum acceptable ratio of silence to speech in a call."
    max_ratio: 0.4
    flag_if_exceeded: "requires-review"

  - id: "snr"
    name: "Signal-to-noise ratio"
    description: "Minimum acceptable SNR for transcription quality."
    unit: "dB"
    min: 15
    flag_if_below: "requires-review"

  - id: "clipping"
    name: "Audio clipping"
    description: "Maximum acceptable percentage of clipped samples."
    max_percent: 2.0
    flag_if_exceeded: "requires-review"

  - id: "reverb"
    name: "Reverberation"
    description: "Maximum acceptable RT60 reverberation time."
    unit: "seconds"
    max: 0.8
    flag_if_exceeded: "requires-review"

  - id: "bandwidth"
    name: "Bandwidth"
    description: "Minimum acceptable effective bandwidth."
    unit: "Hz"
    min: 300
    flag_if_below: "requires-review"

  - id: "dc-offset"
    name: "DC offset"
    description: "Maximum acceptable DC offset in the signal."
    max: 0.01
    flag_if_exceeded: "requires-review"
