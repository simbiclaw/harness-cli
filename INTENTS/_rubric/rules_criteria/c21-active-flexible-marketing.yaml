# _rubric/rules/c21-active-flexible-marketing.yaml
# Item 21 — 积极灵活营销 (observable marketing quality)
#
# Compiled by: 9003 soft-criteria compiler
# Inputs: rubric_com_hotline.md :: Item 21, 营销触发-reconciled.yaml (marketing_scripts only)
# Dimension: 业务引导 (Commercial Guidance), weight: 1x
# Gap type: calibration_surface_form — model_based judgment supplies holistic
#   verdict; lexical signals gate at S3; AUTH-9 withholds auto-final until
#   calibration manifest covers the failure surface.
#
# Compilation epoch: <pinned-at-compile-time>
# Calibration manifest epoch: null (not yet injected — AUTH-9 withholds auto-final)
#
# Dependencies: Item 21 depends on Item 20 S01 (opportunity detected) and
# S04 (agent responded). Only activates when a marketing opportunity WAS
# identified AND the agent DID respond. If Item 20 is NA (no opportunity) or
# Item 20's action check fails (agent ignored trigger or dismissed),
# Item 21 is NA.

rule_id: "C21-001"
rule_name: "Active flexible marketing — quality of commercial guidance"
version: "2.0.0"
last_updated: "2026-07-15"
source_item: "21"
source_document: "rubric_com_hotline.md"
companion_document: "营销触发-reconciled.yaml"
gap_type: "calibration_surface_form"
auto_final_allowed: false  # AUTH-9: calibration manifest must cover the
  # failure surface before auto-final is permitted for this criterion.
  # The severity_map manifest_epoch is null; until the manifest covers
  # the residue classes declared below, auto_final remains false.

description: >
  Evaluates the quality of marketing behavior when the agent offers commercial
  guidance. The assessment decomposes into two layers: (1) lexical/ordered-
  relation signals that S3 can verify deterministically (the agent's utterance
  matches a marketing pattern, contains recommendation keywords, includes
  benefit-indicator keywords, does not use dismissive language), and (2) a
  model_based signal (quarantined in S2) that assesses context-adaptation
  quality. Lexical signals provide gate-layer evidence; the model_based
  corroborator supplies the final holistic judgment. The gate layer does not
  substitute for quality assessment — it verifies that observable marketing
  behavior occurred.

# ============================================================================
# Layer 1: Semantic binding (B-A) — item -> dimension via align.md
# ============================================================================

dimension: "业务引导"
dimension_weight: 1.0

deduction_weight: 1.0
# Deduction weight matches the item's rubric weight (1x). Not scaled by
# corroboration — corroboration moves routing (clears finding_thin), never
# the deduction arithmetic (I6).

severity_map:
  ref: "calibration://manifest/epoch-000/severity/c21"
  manifest_epoch: null
  # Populated at first calibration manifest injection (M7). Until then,
  # severity refs are unresolved and AUTH-9 withholds auto-final for this
  # surface-form criterion.

# ============================================================================
# Layer 2: Trigger/signal decomposition (A1, A2, B-D)
# ============================================================================
# Six orthogonal signals decompose "积极灵活营销" into gate-checkable facets.
#
# AUTH-1 compliance: No adjective or evaluative label appears in any signal
# description or spec. Every spec is expressed as a deterministic pattern that
# S3 can verify against the transcript without model judgment.
#
# Signal architecture:
#   Lexical/ordered-relation signals (A1, B, C, D) — S3 gate-checkable.
#   Model_based signals (A2, model_judgment corroborator) — quarantined in S2.
#   Scoring synthesis: lexical signals provide evidence; the model_based
#   corroborator supplies final holistic judgment. The model_based verdict
#   is quarantined (I1 — the model proposes in S2; S4a score() is pure and
#   never receives model output as input).

signals:
  - id: "C21-SIG-A1"
    name: "trigger_adjacent_marketing"
    description: >
      The agent's marketing turn occurs within 3 turns after a customer
      utterance containing a trigger keyword from the reconciled marketing
      trigger source. This checks temporal proximity between the customer's
      stated need/trigger and the agent's marketing response. The trigger
      keyword list is defined in the reconciled source document
      (营销触发-reconciled.yaml). A1 does not assess whether the marketing
      content is contextually appropriate — that is deferred to A2.
    form: "ordered_relation"
    spec: >
      agent_marketing_turn PRECEDES_BY customer_trigger_keyword WITHIN 3_turns
      WHERE agent_marketing_turn = utterance matching any marketing_script
        pattern from {S2,S3,S4,S5,S6,S9,S11,S12,S15,S16,S17,S18}
      AND customer_trigger_keyword = utterance matching a trigger keyword
        from 营销触发-reconciled.yaml::trigger_keywords
    checkable: true
    required_evidence: ["transcript_turn_pair", "rubric_lookup"]
    fail_condition: >
      Agent produces a marketing-turn utterance (matching one of the 12
      marketing scripts) and no customer trigger keyword from the reconciled
      source appears in the preceding 3 turns. A gap exceeding 3 turns or
      zero trigger-keyword turns in the 3-turn window causes the signal to
      fail. Inconclusive: transcript begins with agent marketing (no prior
      customer turns available) — signal abstains rather than fails.

  - id: "C21-SIG-A2"
    name: "context_adaptation_quality"
    description: >
      The degree to which the agent's marketing language is adapted to the
      customer's stated trigger or context. This is a model_based assessment:
      given the customer trigger turn(s) and the agent's marketing response,
      the model evaluates whether the marketing content addresses the
      customer's specific stated need rather than delivering a generic pitch.
      A2 is NOT gate-checkable — context-adaptation quality is a holistic
      judgment. This signal is quarantined in S2 (the proposer), never
      evaluated by S3 (I1). The lexical proxy (A1) and benefit-indicator
      check (C) provide the S3-verifiable evidence of marketing behavior.
    form: "model_based"
    spec: "model_judgment(agent_marketing_utterance, customer_trigger_turns) -> context_adaptation_score"
    checkable: false
    required_evidence: ["transcript_turn_pair", "model_call"]
    fail_condition: >
      The model's context-adaptation score falls below threshold (defined in
      calibration manifest). This signal abstains if no customer trigger turn
      was identified (A1 abstains) — context adaptation cannot be assessed
      where no customer trigger exists.

  - id: "C21-SIG-B"
    name: "specific_recommendation"
    description: >
      The agent recommends a specific option rather than listing alternatives
      and deferring the choice to the customer. A specific recommendation uses
      directive or advisory language from the recommendation-set and does NOT
      use choice-granting phrases from the choice-deferral-set. This is the
      primary evidence that the agent is actively guiding rather than passively
      informing. The distinction maps to the rubric's "active selling" vs.
      "simple narration" (简单叙述) boundary.
    form: "lexical"
    spec: >
      utterance_contains({建议, 推荐, 帮您办理, 为您办理, 给您申请, 给您开通})
      AND NOT utterance_contains({您可以选择, 你自己选, 您自己决定, 您考虑,
      您看哪个方便, 都可以的, 都行的})
    checkable: true
    required_evidence: ["transcript_turn"]
    fail_condition: >
      Agent utterance contains choice-deferral-set phrases and lacks any
      recommendation-set phrase. Example: "您可以办理普通登录或证书登录，
      您自己选择就行" (you can use normal login or certificate login,
      just choose). This matches the rubric's 0分 explicit examples.

  - id: "C21-SIG-C"
    name: "benefit_articulation"
    description: >
      After or concurrent with a recommendation utterance, the agent's turn
      contains at least one benefit-indicator word or phrase. Benefit
      indicators are lexical markers of causal explanation, outcome
      description, or value proposition. NOTE: The gate layer checks ONLY
      for lexical presence of benefit indicators. It CANNOT distinguish
      context-specific benefits (tailored to customer's stated situation)
      from generic benefit statements. Context-specificity assessment is
      deferred to the model_based signal (A2). This limitation is declared
      residue (see residue_declared section).
    form: "lexical"
    spec: >
      recommendation_turn WITHIN 5_turns OF utterance_contains({因为,
      这样就能, 可以帮您, 就不用, 省得, 方便, 省时, 省钱, 省事,
      不用麻烦, 节省, 提高效率, 避免, 好处, 优势})
    checkable: true
    required_evidence: ["transcript_turn"]
    fail_condition: >
      Agent recommends a product/service but within 5 turns of the
      recommendation no benefit-indicator keyword appears. A benefit-indicator
      keyword is from the set defined above. The gate does not assess whether
      the benefit statement is context-specific — it only verifies that a
      benefit-formulation string is present.

  - id: "C21-SIG-D"
    name: "objection_non_dismissal"
    description: >
      If the customer expresses reluctance, skepticism, or resistance to a
      marketing offer, the agent does NOT respond with a dismissive utterance.
      The gate checks: agent response is NOT in the dismissive_set AND is
      at least 5 characters in length. The dismissive_set is an exhaustive
      list of known dismissive patterns. Model_based assessment (via the
      model_judgment corroborator) handles whether the agent's non-dismissive
      response substantively addresses the objection — the gate layer only
      excludes explicit dismissals.
    form: "lexical"
    spec: >
      IF customer_turn_contains_objection THEN
        agent_response NOT IN dismissive_set
        AND length(agent_response) >= 5
      WHERE dismissive_set = {好的那算了, 那算了, 好的, 嗯, 哦, 行吧, 随便你}
    checkable: true
    required_evidence: ["transcript_turn_pair"]
    fail_condition: >
      Customer turn contains an objection keyword (不要, 不需要, 太贵,
      没兴趣, 算了, 下次再说, 考虑考虑) AND the agent's response in the
      subsequent 2 turns is in the dismissive_set OR is under 5 characters.
      Examples of failing responses: "好的那算了" (ok then forget it),
      "嗯" (mm-hmm), "哦" (oh), "行吧" (fine).

  - id: "C21-SIG-E"
    name: "script_deviation"
    description: >
      The agent's marketing utterance differs from the standard marketing
      script templates. Word-level Jaccard similarity against the closest
      marketing-script template below a threshold indicates original
      formulation. Similarity at or above the threshold indicates rote
      reading (刻板 — rigid delivery). The reference set is the 12
      marketing_scripts from 营销触发-reconciled.yaml (scripts S2,S3,S4,S5,
      S6,S9,S11,S12,S15,S16,S17,S18). Non-marketing scripts (S1 intro,
      S7 work hours, S8 platform registration, S13/S14 generic intros) are
      EXCLUDED from the comparison — matching against a non-marketing script
      is not evidence of rigid marketing delivery.
    form: "threshold"
    spec: >
      jaccard_similarity(agent_marketing_utterance,
        closest_marketing_script) < 0.70
      WHERE reference_marketing_scripts = marketing_scripts from
        营销触发-reconciled.yaml: {S2,S3,S4,S5,S6,S9,S11,S12,S15,S16,S17,S18}
    checkable: true
    required_evidence: ["transcript_turn", "rubric_lookup"]
    fail_condition: >
      Agent marketing utterance has Jaccard similarity >= 0.70 with one of
      the 12 marketing scripts from 营销触发-reconciled.yaml. This indicates
      the agent read the script verbatim or near-verbatim without adapting
      language. Matching is done against word-set overlap (content words only,
      stopwords excluded). Non-marketing scripts are excluded from the
      reference set — a match to a non-marketing script is not evaluated.

# ============================================================================
# Layer 3: Gate structure (B-B applicability, A3 corroboration, A4 residue)
# ============================================================================

applicability_gate:
  depends_on:
    - item: "20"
      condition: "Item 20 is NOT NA AND Item 20 signal S01 = 1 (opportunity detected) AND Item 20 signal S04 = 1 (agent responded)"
  spec: >
    Item 21 evaluates the QUALITY of marketing activity and only activates
    when Item 20 confirms (a) a marketing opportunity was present (S01) and
    (b) the agent did respond to it (S04). If Item 20 is NA (no marketing
    opportunity in the call), or Item 20 evaluates as 0 (agent failed to
    respond to a clear opportunity), or Item 20 hard-fails (opportunity
    completely missed — agent neither detected nor responded), Item 21 is
    NA — you cannot evaluate the quality of something that did not occur.
    This gate is a hard condition: if the input fails, Item 21 returns NA
    immediately without signal evaluation.

corroborators:
  - source: "acoustic_measurement"
    independence_class: "independent"
    weight: 1.0
    description: >
      Speech rate delta and pause-duration patterns around the marketing
      pitch turn. Active, adapted marketing shows a natural cadence change:
      rate slows during benefit articulation, pauses for emphasis before
      the key offer. Rote reading shows consistent rate (no cadence change)
      and short pre-benefit pauses (<0.3s, indicating rushed delivery without
      emphasis). These measurements use the acoustic indicator framework at
      _rubric/acoustic/indicators.yaml — pure sensor data, no model judgment.
    indicators:
      - "|speech_rate_pitch - speech_rate_baseline| < 0.3 s.d. AND pre_benefit_pause < 0.3s -> mechanical_reading"
      - "|speech_rate_pitch - speech_rate_baseline| > 0.5 s.d. OR pre_benefit_pause > 0.5s -> adaptive_pacing"
      - "post_objection_pause < 0.5s AND turn_overlap < 1.5s -> no_processing(dismissive)"

  - source: "phrase_lexicon"
    independence_class: "independent"
    weight: 1.0
    description: >
      Presence of recommended marketing language and absence of dismissive
      language in the agent's marketing turns. The phrase lexicon at
      _rubric/phrase-keyword/lexicon.yaml defines which phrases are measured.
      High-quality marketing shows more recommended-phrase usage and zero
      negative/dismissive phrases. This is a lexical count — pure pattern
      match against the reference lexicon, not model judgment.
    indicators:
      - "recommended_marketing_phrase_count >= 2 -> signals_active_engagement"
      - "recommended_marketing_phrase_count < 1 -> signals_perfunctory"
      - "negative_phrase_present == true -> signals_dismissive_tone"

  - source: "model_judgment"
    independence_class: "correlated"
    weight: 0.4  # W_C PROVISIONAL
    description: >
      The model's holistic assessment of marketing quality. This is the
      correlated channel (same text being judged as the primary signal
      channels). W_C = 0.4 is PROVISIONAL — the correct value is
      1 - corr(matcher_error, proposer_error) measured on a human-labeled
      sample of marketing-quality evaluations. Corroboration from this
      source can clear finding_thin (signal-level uncertainty) but never
      criterion_below_tau (D4). The weight is independent of the number
      of model-judgment signals: soft+soft = 0 (D5).

# ============================================================================
# Scoring synthesis (W7) — how signals combine into verdict
# ============================================================================
#
# The six signals and corroborators combine through a two-layer architecture:
#
# Layer 1 — Lexical gate evidence (S3):
#   Signals A1, B, C, D, and E are gate-checkable by S3. Each produces a
#   binary evidence signal (pass/fail/abstain). These signals verify that
#   observable marketing behavior occurred: a marketing utterance was
#   delivered within temporal proximity of a customer trigger (A1), used
#   recommendation language (B), contained benefit indicators (C), avoided
#   dismissive patterns (D), and was not a rote script reading (E).
#
#   These lexical signals alone do NOT produce a verdict. They provide
#   evidence that feeds into the corroboration aggregator. A signal that
#   fails (e.g., no benefit indicator found) triggers a finding at the
#   signal level but does not by itself determine the criterion score.
#
# Layer 2 — Model_based holistic judgment (S2, quarantined):
#   Signal A2 (context_adaptation_quality) is a model_based assessment
#   quarantined in S2 (I1). The model proposes a verdict on whether the
#   agent's marketing was adapted to the customer's stated need. This
#   proposed verdict does NOT enter the pure scoring stages directly.
#
#   The model_judgment corroborator (also quarantined in S2) provides
#   an additional holistic assessment. Per I1, the model proposes in S2;
#   S4a score() is pure and never receives model output as a direct input.
#   The model_based verdict is quarantined — the pure stages (S3 ground,
#   S4a score, S4b adjust) re-derive the final score from grounded evidence
#   alone. Model-proposed scores are logged as drift probes, never as
#   results (D8).
#
# Corroboration aggregation (S4b, pure):
#   The corroboration aggregator (core/corroboration.py) is a pure function.
#   It takes grounded evidence from S3 (the lexical/ordered-relation signals)
#   and weights each corroborator by its independence class. Independent
#   signals (acoustic, phrase-lexicon) receive weight 1.0; the correlated
#   model_judgment signal receives W_C = 0.4 (provisional). Redundant signals
#   (another model-judged text criterion on the same span) contribute zero
#   per D5: soft+soft = 0.
#
#   Corroboration changes routing (clears finding_thin deferral), never the
#   deduction arithmetic (I6). A violation's deduction is the rubric's weight
#   for its anchor, regardless of how many instruments observed it.
#
# Final verdict derivation (I3):
#   raw = score(facts, rubric) — pure function of grounded findings + rubric
#   adjusted = adjust(raw, history) — pure function of score + precedent
#   The shipped score is always adjusted, never raw alone. raw and adjusted
#   are byte-identical on re-derivation with the same inputs.

residue_declared: >
  The six signals above cannot capture the following aspects of marketing
  quality, which remain in the calibration_surface_form gap — addressed by
  the calibration manifest when it covers the failure surface:

  (a) CONTEXT-SPECIFICITY OF BENEFITS (W3): Signal C (benefit_articulation)
      checks only for lexical presence of benefit indicators. It cannot
      distinguish a generic benefit statement ("it saves time") from a
      context-specific one ("since you mentioned the trip is urgent, this
      express service saves your delivery deadline — your goods arrive by
      Friday instead of next Tuesday"). Context-specificity assessment is
      deferred to the model_based signal (A2) and the model_judgment
      corroborator. This is documented here (A4 requirement) to prevent
      s gate from claiming it measures what it does not.

  (b) TONAL QUALITY: Non-lexical marketing quality (warmth, helpfulness,
      flat disinterest). The acoustic indicators provide partial coverage
      (pitch range, speech rate), but tonal intent is a model judgment that
      S3 cannot verify.

  (c) TIMING JUDGMENT: Whether the agent chose the natural moment for the
      pitch (after rapport was built, when customer was receptive) vs.
      interrupting or inserting the pitch at an awkward moment. Signal A1
      (temporal proximity) checks whether a trigger existed within 3 turns,
      but social appropriateness of the timing cannot be gated.

  (d) CREATIVITY AND ADAPTATION: Whether the agent reframed the marketing
      message in an original way beyond mere deviation from the standard
      script. Signal E (script_deviation) captures deviation from exact
      template but not quality of the adapted formulation. Signal A2
      (context_adaptation_quality) provides a model_based assessment but
      is quarantined.

  (e) CUSTOMER RECEPTIVITY: Whether the customer actually understood,
      agreed with, or was persuaded by the recommendation. Signal D
      (objection_non_dismissal) catches overt dismissal but misses silent
      disengagement or affirmative commitment.

  (f) PRODUCT APTNESS: Whether the recommended product was genuinely the
      right fit for the customer's stated needs vs. a generic upsell.
      Signal A1 (trigger_adjacent_marketing) catches that a trigger existed
      nearby but not whether the match was appropriate. Signal A2 provides
      model_based assessment.

  (g) FOLLOW-THROUGH: Whether the agent secured a commitment, set a next
      step, or confirmed the customer's understanding of next actions.
      This is partially covered by objection engagement (Signal D) if the
      customer declined, but affirmative commitment is not measured.

  These gaps are documented here (A4 requirement). They inform the
  calibration manifest's failure-surface coverage. When the manifest covers
  them, AUTH-9 may permit auto-final for this criterion.

# ============================================================================
# Layer 4: Governance structure (A5 agreement, A6 deduction, A7 iteration,
#           B-C hard fail)
# ============================================================================

agreement:
  tau: 0.8
  # Initial agreement threshold. Adjusted via the agreement instrument (section 6)
  # when accumulated human-vs-Argus kappa data justifies a change.
  kappa_sample_plan:
    sample_size: 30
    sampling_strategy: "stratified — 15 perceived-quality (1分) + 15 perceived-perfunctory (0分) calls, identified by proposer's signal output distribution"
    recompute_interval: "weekly"
    evaluation_method: "Cohen's kappa between Argus verdict and 2 independent human reviewers"
  escape_sample_plan:
    sample_size: 20
    sampling_strategy: "random sample from auto-final calls (once AUTH-9 is cleared)"
    recompute_interval: "weekly"
  escape_ceiling: 0.05
  # Maximum acceptable escape rate: no more than 5% of auto-final verdicts on
  # this criterion should be wrong (human-caught as misses). A rising escape
  # rate demotes the criterion even when kappa is healthy (D11).
  current_kappa: null
  # Populated after first human-vs-Argus comparison cycle.

data_dependency:
  connected: false
  defer_disposition: >
    Item 21 depends on two data sources that are rubric nodes (not external
    data): (1) the marketing_scripts reference set from
    营销触发-reconciled.yaml (12 scripts for Jaccard comparison in Signal E,
    trigger keywords for Signal A1), and (2) the trigger_keyword patterns
    from the same reconciled source. Both are compiled rubric artifacts,
    not external data feeds. The phrase lexicon and acoustic indicator
    framework are also rubric nodes. The model_judgment corroborator is
    a model call result (not a data dependency). Because connected=false
    and no external data source blocks the criterion, deferral is on the
    calibration_surface_form axis (AUTH-9), not on data availability.

iteration_policy: "re-ground via write-time epoch commit only; no rule edits from Argus output"
# A7 — The compiler is the write-time path. Corrections, trigger refinements,
# or residue annotations discovered through Argus evaluation do NOT auto-edit
# this node. They enter through the upstream correction pipeline (S6), which
# mints a new INTENTS epoch. Argus reads the new epoch when the git SHA is
# re-pinned.

# B-C: hard_fail_rule is absent for Item 21.
# Item 21 is a QUALITY spectrum (active marketing vs perfunctory marketing),
# not a binary pass/fail gate. A single deficient signal does not trigger
# IMMEDIATE-FAIL routing to a human — the multi-signal assessment,
# corroboration, and coverage gate handle routing.
# The 业务引导 dimension's hard-fail threshold is owned by Item 20 (marketing
# opportunity completely missed), not by this quality-assessment item.
# Cross-item note (m4): When Item 20 hard-fails (e.g., agent completely missed
# a clear marketing opportunity — no detection, no response, no engagement),
# Item 21 automatically returns NA. This is enforced by the applicability_gate:
# if Item 20 S01=0 or S04=0, Item 21 gates to NA. If Item 20 hard-failed
# (multiple signals indicating complete absence of marketing behavior),
# Item 21 is unconditionally NA — you cannot assess the quality of something
# that never occurred.
