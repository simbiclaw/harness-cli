# _meta/conventions.yaml — naming, formatting, and structural rules for the INTENTS tree.
#
# Every file in the tree must conform to these rules. Violations fail CI.

naming:
  grammar: "<type>.<slug>.<ext>"
  type_description:
    kb: "knowledge base / descriptive fact"
    cookbook: "best practice precedent"
    errors: "error case precedent"
    case: "L3 case node directory (not a file — the directory name)"
    index: "L2 capsule Bone (markdown)"
    ui_step: "L2 capsule Flesh (yaml)"
  slug_rules:
    - "demand-minted from customer language"
    - "lowercase, hyphen-separated"
    - "permanent — renaming is a breaking change"
  ext_rules:
    yaml: "structured data (context, facts, history, rubric)"
    json: "machine-generated artifacts (tensors)"
    jsonl: "streaming/large collections"
    md: "human-authored content (index, AGENTS)"

structural:
  anchor_levels:
    rubric: "_rubric/ — anchored to rubric version"
    scope: "<domain>/ — facts anchored to domain scope"
    l3_case: "<domain>/<case>/ — history anchored to L3 case node"
  ownership: "every file owned by exactly one producer; zero multi-owner, zero orphaned"
  bindings: "every ui_binding_ref in Bone resolves to a ui_step in Flesh"

forbidden:
  - "no file without a producer"
  - "no file owned by more than one producer"
  - "no ui_binding_ref that doesn't resolve"
  - "no slug rename without an ADR"
