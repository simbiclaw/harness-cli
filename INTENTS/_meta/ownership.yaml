# _meta/ownership.yaml — producer → file glob mapping.
#
# Every file in the INTENTS tree must match exactly one glob.
# Zero multi-owner. Zero orphaned. CI-enforced.

producers:
  - name: audio2tree
    description: "Produces the intents tree from support-call audio: L2 capsules, L3 cases, kb.*.yaml facts, and the _rubric/ shelf."
    globs:
      - "AGENTS.md"
      - "EPOCH.yaml"
      - "tensors.json"
      - "_meta/conventions.yaml"
      - "_meta/ownership.yaml"
      - "_rubric/rules/*.yaml"
      - "_rubric/acoustic/*.yaml"
      - "_rubric/phrase-keyword/*.yaml"
      - "annual-report-submission/index.md"
      - "annual-report-submission/ui_steps.yaml"
      - "annual-report-submission/*/context.yaml"
      - "annual-report-submission/*/kb.*.yaml"
      - "annual-report-submission/*/cookbook.*.yaml"
      - "annual-report-submission/*/errors.*.yaml"

  - name: doc2graph
    description: "Produces the compute graph from operation manuals."
    globs: []

  - name: Navigator
    description: "Produces operator sequences from live web-app instrumentation."
    globs: []
