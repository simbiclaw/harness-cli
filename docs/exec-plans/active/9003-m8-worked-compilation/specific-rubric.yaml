# Specific QA Rubric — full 27-item conversion of sources/rubric_com_hotline.md
# (real human-authored rubric; standards copied verbatim, no invented values).
# Items 6 and 7 (marked * in the source) require external system data
# (ticketing / escalation records) — align.md maps them to no dimension, so
# they emit dimension_coverage_gap rows (defer_until_source_connected).
# Item 18 is byte-identical to the 9003-pilot-item18 entry (pilot contract).
# named_phrases / numeric_thresholds: only values the rubric text itself
# carries (B-D, confidence 1.0). Dependencies per patch-2 S3: 20→21, 22→26.
rubric_name: "hotline-real-27"
items:
  - id: "1"
    text: "有起接语且完整/外呼明确身份"
    values:
      named_phrases: ["您好"]
      numeric_thresholds: []
    na_condition: >-
      系统原因导致未能听到起接语或开头一小部分（支持电话中若对方已知身份的，未表明身份）
    pass_standard: >-
      有起接语 标准起接 "您好。" /如外呼电话，需清晰的表明身份，不用明确到人。
    fail_standard: ""
    deduction_weight: 1.0

  - id: "2"
    text: "有称谓语且规范"
    values:
      named_phrases: ["小姐", "先生", "女士", "老师", "贵姓"]
      numeric_thresholds:
        - { name: "询问贵姓次数上限", threshold: 2 }
    na_condition: >-
      其他没有明显得1分或0分的情形
    pass_standard: >-
      整通电话里礼貌的称呼来话人，如："X小姐/先生/女士"。称谓正确且前后一致。支持客服只需能合适的称呼对方，礼貌，不引起对方反感即可。客服问了称谓，但是企业未回答，也不必称呼女士/先生。如遇市监电话需称呼其为老师。
    fail_standard: >-
      有以下情况者为不通过：①无称谓（除对方不愿告知外）；②明显称呼错误（如对方表示姓陈，客服称呼王XX，等）；③前后称谓不一致（如前面称呼正确，后面称呼错误）；④>2次询问贵姓。
    deduction_weight: 1.0

  - id: "3"
    text: "能够快速准确灵活的进行信息查询及搜索"
    values:
      named_phrases: []
      numeric_thresholds: []
    na_condition: >-
      电话中不涉及到信息查询。
    pass_standard: >-
      通过各类系统查询咨询信息的时候，方法正确，操作快速，能灵活的运用不同方式进行搜索，例如不同的搜索项、关键字等。对常用的地名和区域划分等能准确快速的进行录入。
    fail_standard: >-
      有以下情况者为不通过：①查询方法错误；②不清晰的词组还要反复询问企业（地名和服务点名称县级及以上需掌握）；③对常用的地名、区域和清晰的词组还要反复询问企业（地名和服务点名称县级及以上需掌握）；
    deduction_weight: 1.0

  - id: "4"
    text: "无声电话、保留电话、转接候线用语规范操作正确，候线时长不超过30秒"
    values:
      named_phrases: ["请稍等", "您稍等", "请不要挂机", "非常感谢您的耐心等待"]
      numeric_thresholds:
        - { name: "候线时长上限（秒）", threshold: 30 }
    na_condition: >-
      电话中未发生无声电话、保留电话、转接电话。
    pass_standard: >-
      转接、候线操作规范；用语规范。候线语（请稍等、您稍等，您的问题我需要进行确认，请不要挂机）、召回语（X先生/小姐，您好。非常感谢您的耐心等待，您的问题是这样的...)。转接、候线时长不超过30秒；
    fail_standard: >-
      电话中明确需要候线却未采用候线的方法导致电话空白。
    deduction_weight: 1.0

  - id: "5"
    text: "有结束语且完整"
    values:
      named_phrases: ["再见", "还有其他问题", "满意请按1"]
      numeric_thresholds: []
    na_condition: >-
      客户非正常中断电话；话机问题。
    pass_standard: >-
      通话结束前应按标准说结束语："再见！" 每通电话在讲结束语之前，与企业确认是否还有其他问题，无问题后转结束语；请稍后请对本次服务做个评价，满意请按1，再见！（不含糊，表达清楚意思即可）
    fail_standard: >-
      结束语无或不完整；时间允许范围内未报读结束语；结束语含糊带过；
    deduction_weight: 1.0

  - id: "6"
    text: "服务记录规范"
    values:
      named_phrases: []
      numeric_thresholds: []
    na_condition: >-
      系统问题不能做服务记录/通话时长小于1分30秒
    pass_standard: >-
      接听电话按规范做好服务记录，包括联系电话、问题类型、问题信息/服务信息、工单状态。联系电话：必须在联系人信息处有和实际情况一致的号码；问题类型：必须与实际情况一致，并且列表中已有的问题类型，不能选择其他，如外省企业，需要去政务网注册，可以选择注册不成功，不能选其他；问题信息/服务信息：①问题信息/服务信息符合电话实际 ②要求选择/写明企业问题、处理过程和处理结果；③电话中涉及业务引导问题信息/服务信息中必须选择/写明要操作的业务，费用可以不用写；服务方式：是必填项，选错不扣分。工单记录时间：电话挂断后的5分钟内；工单状态：需按照实际情况选择，①如提交了远程，CSC自动分配，状态应选择提交远程；②电话中引导企业到1800或微信上获取远程，服务内容中需写明"提交1800或微信"状态选择待跟进；③如果是自己要做远程，状态选择待跟进，后续远程结束再关闭④服务状态是待跟进，客服记录要写清处理结果；服务方式选择正确（要按照实际情况选择，例如：电话不能选择在线或者远程；与对接之间的沟通、与组长沟通不能选择在线或者远程；选择内部交流）。
    fail_standard: >-
      联系电话：联系人信息中无目标来电号码；问题信息/服务信息：与实际情况不符，包括内容不符合和必要信息不完整。未做服务记录；工单记录时间为电话挂断后5分钟内；工单状态：与实际情况不符；服务方式选择错误
    deduction_weight: 1.0

  - id: "7"
    text: "问题升级流程操作完整且规范"
    values:
      named_phrases: []
      numeric_thresholds: []
    na_condition: >-
      电话中未涉及到问题升级。
    pass_standard: >-
      在承诺时间范围内及时升级且相关信息记录、操作完整无误。当录音质检时，只要能确认客服已将提交所需信息全部都确认清楚了，即可视为通过（需确认信息：远程--具体问题、qq、企业名称；电话--具体问题、回访电话确认；需姓名；回访时间确认）。
    fail_standard: >-
      有以下情况为不通过：①逾期未处理；②问题未确认清楚；③电话中，升级信息未确认完整
    deduction_weight: 1.0

  - id: "8"
    text: "表达清晰流畅，口齿清楚；无过多口语"
    values:
      named_phrases: ["的话", "那个", "的哦", "的呢", "这个"]
      numeric_thresholds:
        - { name: "口语密集重复次数上限", threshold: 2 }
    na_condition: null
    pass_standard: >-
      表达清晰明朗，口齿清楚，不含糊，不拖音，能让客户听明白；无过多口语。
    fail_standard: >-
      口齿含糊不清；口语较多，如"的话""那个"等；表达未能体现专业性，过于随便或口语化，如直呼usb-key为"U盘"、年报为"年检"、市监为"工商"、工商局发证等、表达正确、出现明显惊讶的语言等。密集重复出现口语>2次，如"的哦"、"的呢"、"那个"、"这个"、"的话"等。
    deduction_weight: 1.0

  - id: "9"
    text: "语速适中，能配合客户的速度，语音平稳"
    values:
      named_phrases: []
      numeric_thresholds: []
    na_condition: null
    pass_standard: >-
      语速适中，能配合客户的速度，音量能使客户听清，不会出现忽高忽低的情况
    fail_standard: >-
      出现一下情况视为不通过：①语速过快或过慢，使得客户表现出沟通上的不适；②语音突然出现明显上升或下降，使人感到不适；③电话中虽未出现抢话，可是多次出现由于接话太急等原因造成的略有重叠；客户语速很慢，客服语速快，客户表达了"需要慢一点"。
    deduction_weight: 1.0

  - id: "10"
    text: "适时使用礼貌用语"
    values:
      named_phrases: ["您好", "您", "请稍等"]
      numeric_thresholds: []
    na_condition: null
    pass_standard: >-
      在整段对话中均能使用礼貌用语并适时使用，例如：您好，您，请稍等。
    fail_standard: >-
      表达不够礼貌，如经常出现"你"等，出现轻微反问句式（支持客服如遇关系紧密的网点除外）
    deduction_weight: 1.0

  - id: "11"
    text: "语气亲切友善，体现热情，耐心的服务"
    values:
      named_phrases: []
      numeric_thresholds: []
    na_condition: null
    pass_standard: >-
      整个沟通过程中精神状态饱满且始终保持热情，体现微笑服务。
    fail_standard: >-
      对待客户爱理不理；表达、处理敷衍；出现不耐烦的语气（轻微）；表现出急于挂断电话；沟通语调冷漠、机械化、无精打采，不能体现微笑服务。
    deduction_weight: 1.0

  - id: "12"
    text: "无无故打断客户的话或抢话、压话"
    values:
      named_phrases: ["非常抱歉，打断您一下"]
      numeric_thresholds: []
    na_condition: null
    pass_standard: >-
      不出现无故打断客户谈话、抢话、压话的情况；当企业有有意打断客服的表达的时候，要适当停顿或询问客户。当确实需要时，适当礼貌的打断用户，例如：非常抱歉，打断您一下；
    fail_standard: >-
      出现和客户抢话现象；出现压话；当企业有意打断客服的表达的时候，不予理睬
    deduction_weight: 1.0

  - id: "13"
    text: "集中精力倾听用户问题"
    values:
      named_phrases: []
      numeric_thresholds: []
    na_condition: null
    pass_standard: >-
      认真专心倾听客户的话。
    fail_standard: >-
      出现以下情况视为不通过：①出现不及时回应；例如企业描述时间稍长的时候，客服一直非常沉默或当企业呼叫客服的时候未及时回应；②当企业产生疑问时，客服未积极回应导致企业多次提问或客服人员反复询问企业同一问题（当无法判断为客服原因造成时除外）；③边远程边接听电话导致思想不集中（例如：发给远程客户的话在电话里说出来）；④由于没有注意倾听，答非所问，与客户沟通严重脱节。⑤由于没有注意倾听，答非所问，出现服务断片。
    deduction_weight: 1.0

  - id: "14"
    text: "表达委婉，善于使用正面言辞"
    values:
      named_phrases: ["我不知道", "我没办法", "这个无法告诉您"]
      numeric_thresholds: []
    na_condition: null
    pass_standard: >-
      表达委婉，善于使用正面言辞。
    fail_standard: >-
      出现以下情况视为不通过：①客服人员说话生硬，唐突；③不合时宜的发笑；④多次出现"我不知道""我没办法""这个无法告诉您"等；⑤沟通中诋毁或直接否定其他同事。
    deduction_weight: 1.0

  - id: "15"
    text: "表达内容重点突出，简明扼要"
    values:
      named_phrases: []
      numeric_thresholds: []
    na_condition: null
    pass_standard: >-
      描述或解释中能抓住重点，简单，不罗嗦。
    fail_standard: >-
      表达复杂啰嗦；缺乏针对性；语言组织有歧义或不易理解，无法将正确信息快速传达给企业。
    deduction_weight: 1.0

  - id: "16"
    text: "理解用户的问题或需求"
    values:
      named_phrases: []
      numeric_thresholds: []
    na_condition: null
    pass_standard: >-
      根据用户提供的信息，掌握用户的问题或需求。
    fail_standard: >-
      没有理解用户的需求、问题或由于没有快速理解导致指导绕弯，浪费时间（辨识过程比较曲折）
    deduction_weight: 1.0

  - id: "17"
    text: "能主动引导用户，有效把握电话节奏，保持客服引导与用户操作同步，无放空白过多或过长影响沟通氛围"
    values:
      named_phrases: []
      numeric_thresholds:
        - { name: "非客服原因空白上限（秒）", threshold: 30 }
        - { name: "客服原因空白上限（秒）", threshold: 15 }
    na_condition: null
    pass_standard: >-
      能主动引导客户，当客户偏离主题时能有效引导客户回到咨询主题；避免一问一答的咨询，能主动清楚地说明操作的意图和目的，让用户能够理解、谅解、愿意配合操作；操作沟通密切紧凑（能解释获取对方进度或告知对方进度），能有效控制电话节奏；能主动获取更多用户信息。
    fail_standard: >-
      客户问题偏离主题时，不能有效控制或引导，甚至由客户主动与客服人员确认问题；电话中被客户主导；指导和客户操作脱节；当企业不配合操作时未能有效引导或转折开去；非客服原因导致30秒以上空白或者由于客服原因导致15秒以上空白；沟通中，不关注客户的理解程度，只顾着自己说。
    deduction_weight: 1.0

  - id: "18"
    text: "思路清晰，能根据客户理解程度，灵活的给予合理的处理办法，解释说明和操作指导"
    values:
      named_phrases: ["客服系统", "业务手册", "思路混乱", "引导延期"]
      numeric_thresholds: []
    na_condition: null
    pass_standard: "针对不同的用户理解能力、操作能力、所属环境适时调整自己的说话方式、指导方法，给予合理的处理办法、解释说明和操作指导；善于使用资源（例如客服系统、业务手册等）"
    fail_standard: "思路混乱、发散或完全无方向；没有考虑到用户的立场以及理解能力、操作能力、所属环境，按照自己的思路进行指导；处理或解释死板（不能结合客户实际、主观；不能根据客户的具体情况和疑虑进行灵活解释；不善于使用资源；考虑问题不周，对关联业务判断不足，造成客户肯定会在后续问题。补充例证：未确认清楚企业问题，查客服系统发现过期就直接引导延期，此项将扣分。已经连上远程，企业并未要求，客服继续和企业保持通话。"
    deduction_weight: 1.0

  - id: "19"
    text: "产品业务、操作知识把握准确"
    values:
      named_phrases: ["以市监审核为准", "以市监要求为准"]
      numeric_thresholds: []
    na_condition: null
    pass_standard: >-
      对电话中涉及到的相关业务和操作方面的知识把握准确，没有给用户介绍错误的知识信息
    fail_standard: >-
      给客户提供了错误的产品、业务和操作知识信息；或对已培训的知识信息不清楚；过多无关指导操作或基础检查处理步骤有遗漏；企业对相关业务信息概念不清且容易造成对方后期的误解，客服未纠正；例如：企业觉得证书有存储功能，客服未纠正；例如：企业觉得证书有存储功能，隐含密码，问题处理完了之后必须告知企业为了信息安全，建议用户及时修改密码；涉及到系统填写的，要告知以市监审核为准；涉及到资料审核的，要告知以市监要求为准
    deduction_weight: 1.0

  - id: "20"
    text: "能准确快速抓住营销机会并加以引导。"
    values:
      named_phrases: ["子证书", "移动证书", "授权领证", "数字证书"]
      numeric_thresholds: []
    na_condition: >-
      电话中没有合适的营销机会，或对方已表现出很反感，或为用户主动询问；客服在获悉客户以电子营业执照登录年报、政务网等，未主动向其引导业务，客服未向其引导了授权领证。
    pass_standard: >-
      能准确快速抓取客户的潜在需求或可以给用户推荐我司产品、业务的机会，并有针对性的给用户推荐(如子证书，解锁推荐移动证书)；对于部门规定的营销节点正确引导（一般只考虑到一级营销即可）；企业介质KEY无法使用，或是旧版KEY如握奇飞天，来咨询办理介质证书，灵活积极推荐移动证书；客户表达了只有一个证书可以招投标使用的情况，客服向其引导推介了子证书；客户表达了年报要用证书，或者政务网要用证书等多认使用的情，客服向其引导推介了子证书或授权领证；客户办理移动证书业务，客服向其引导了授权领证；客服在获悉客户以电子营业执照登录年报、政务网等，主动向其引导推介数字证书。
    fail_standard: >-
      对用户表达中明显的潜在营销机会置之不理；未主动推荐客户使用本公司的相关产品，如已有key未用时也没建议使用；无key普通方式操作有问题时未建议新领；企业来电咨询子证书和个体户证书年费内证书到期问题的，客服未正向引导，例如直接告知不需收费之类的；客户表达了只有一个证书可以招投标使用的情况，客服没有引导推介子证书；客户表达了年报要用证书，或者政务网要用证书等多认使用的情况，客服未向其引导推介了子证书；在获悉了客户以普通方式登录年报、政务网等，客服没有引导企业用证书操作年报；客户办理证书解锁业务，客服未向其引导推介移动证书；
    deduction_weight: 1.0

  - id: "21"
    text: "积极、灵活营销"
    values:
      named_phrases: []
      numeric_thresholds: []
    na_condition: >-
      服务过程无营销活动。
    pass_standard: >-
      积极主动，灵活的运用不同的营销话术、方法；根据用户的情况变换，给出最合适的业务引导等；
    fail_standard: >-
      营销意识或能力不足，引导力弱，采用的引导方式多为简单叙述，由用户自行考虑选择的方式（例如证书密码忘记引导解锁或办理移动证书让企业自行选择；普通方式登录和证书登录，让用户自行选择等），营销不够积极，敷衍了事，不管用户是否了解到业务好处，只是刻板或快速带过，导致未能抓住营销机会；
    deduction_weight: 1.0
    companion_docs:
      - { document: "营销话术.md", role: "standard_scripts" }
    depends_on: ["20"]

  - id: "22"
    text: "情绪用户和潜在情绪（如抱怨等）处理"
    values:
      named_phrases: ["认同", "道歉", "陈述"]
      numeric_thresholds: []
    na_condition: >-
      电话中未涉及到情绪用户。
    pass_standard: >-
      遇到情绪客户和潜在情绪客户时能够表现出对客户的同理心，努力帮客户寻求解决办法，采取认同、道歉、陈述等手段引导和安抚用户，能有效地将用户的情绪向正面的方向引导。
    fail_standard: >-
      对于客户的不满、抱怨或虽未表现出不满和情绪但认为起因是我司产品等导致其遇到问题（抱怨）的方式，不能给与妥善解释和处理；不便时，置之不理，采取沉默、无视、推诿（撇清关系）的方式；例证：当企业认为由于证书的原因造成电脑的无法使用等，虽未表现出情绪，但潜在还是有比较着急容易转化为情绪的可能，此时客服应该表现出同理心并进行安抚，不妥当的则是重复表达"这个肯定不是证书造成的"等。
    deduction_weight: 1.0

  - id: "23"
    text: "推卸自身工作职责，将本身工作范围内的问题，推诿给无关方"
    values:
      named_phrases: []
      numeric_thresholds: []
    na_condition: null
    pass_standard: >-
      解决企业提出的已明确的客服工作范围内问题
    fail_standard: >-
      客服由于自身业务知识不扎实等原因，没有经过思考衡量直接把本身工作范围内的问题随意推诿给其他客服，例如指导中知道客户之前加过其他客服，多次让客户直接联系别的客服
    deduction_weight: 1.0

  - id: "24"
    text: "方案准确性；在用户提供的现有信息下，提供给用户的方案准确"
    values:
      named_phrases: []
      numeric_thresholds: []
    na_condition: null
    pass_standard: >-
      提供正确有效检查步骤且能正确判断用户问题症结，提供专业的处理方法或正确的 问题处理方向
    fail_standard: >-
      无正确有效检查步骤，提供不妥当的处理方法或不正确的 问题处理方向；导致公司为此产生额外的成本或损失（如免费处理、索赔、额外工作量、优质客户流失等）；最终给出的处理方法对问题解决用途不大，明显会有二次来电；问题没有处理掉又没有留下有效的处理方式（例如答应给企业修改发票邮寄地址，却没有提交修改；客户反馈使用APP出现问题时，客服不主动进行检查确认，或者让企业直接换手机、买手机。）
    deduction_weight: 1.0

  - id: "25"
    text: "业务办理引导准确，费用正确且办理资料无遗漏"
    values:
      named_phrases: []
      numeric_thresholds: []
    na_condition: >-
      整通电话不涉及业务办理；业务客服推介引导未说明完整，客户已表示后续要办再联系。
    pass_standard: >-
      业务引导正确，费用资料地址说明正确且完整。（涉及印章定制，由于资费比较复杂，可不在电话中说明，但说出口的必须是正确的）（注：凡是需要跟业务办理有关关系的，例如仅仅指导延期、或者咨询网点办理地址、处理业务办理中遇到的问题等，此项均可给1）
    fail_standard: >-
      业务办理引导错误；费用说明错误或忘记说明；需要携带的资料没有说完整；服务点地址说错；
    deduction_weight: 1.0

  - id: "26"
    text: "沟通氛围融洽，警觉性高"
    values:
      named_phrases: []
      numeric_thresholds: []
    na_condition: >-
      整通电话未涉及敏感问题和安全情绪隐患。
    pass_standard: >-
      电话沟通中气氛始终融洽；对于客户隐藏的不满或所提的敏感性问题，能灵活应用服务口径等进行应答，并及时上报隐藏的安全隐患。
    fail_standard: >-
      由于客服个人原因引发企业情绪或导致情绪升级；电话起接前、沟通中、挂断后辱骂或骚扰客户；出现讽刺性语言、嘲笑、冷笑（非善意）、不文明用语等；出现强烈的不耐烦，严重质问、反问，抱怨客户等；多次带有情绪的抢话、压话；怪腔怪调，阴阳怪气；针对敏感性问题，不能灵活使用服务口径，给客户错误解释或解释有偏差；无法察觉客户隐藏的不满；做出存在安全或情绪隐患的行为，未及时上报(安全隐患包括公司相关业务、系统等的不合理现象，情绪隐患如做出不符合常规的服务流程；服务通话过程中接听私人电话，让企业等一下。)
    deduction_weight: 1.0
    depends_on: ["22"]

  - id: "27"
    text: "保证用户信息受到保护，不私自泄漏或公布用户隐私"
    values:
      named_phrases: ["88234732", "忘记密码"]
      numeric_thresholds: []
    na_condition: null
    pass_standard: >-
      客户来电询问政务网经办人信息（用户名或密码），客服让用户自行点击忘记密码找回，或用证书登录查看用户名；其他保护用户信息不被泄露的情形。
    fail_standard: >-
      未经允许将服务商、服务点人员手机号码公布给企业；公司内部电话除了88234732（公司前台）和证书业务部同事电话外不能对外公布；未经允许或未按正确流程，对外公布网点的业务、财务等信息；年报联络员收不到验证码，来电咨询，客服在未核实对方手机号码和单位名称的前提下、后台查询后直接告诉对方；
    deduction_weight: 1.0
