# Pilot: item 18 only — converted from docs/PRD/eval/rubric_com_hotline.md (real rubric).
# 技能技巧 · 思路清晰，能根据客户理解程度，灵活的给予合理的处理办法
rubric_name: "hotline-real-item18-pilot"
items:
  - id: "18"
    text: "思路清晰，能根据客户理解程度，灵活的给予合理的处理办法，解释说明和操作指导"
    values:
      named_phrases: ["客服系统", "业务手册", "思路混乱", "引导延期"]
      numeric_thresholds: []
    na_condition: null
    pass_standard: "针对不同的用户理解能力、操作能力、所属环境适时调整自己的说话方式、指导方法，给予合理的处理办法、解释说明和操作指导；善于使用资源（例如客服系统、业务手册等）"
    fail_standard: "思路混乱、发散或完全无方向；没有考虑到用户的立场以及理解能力、操作能力、所属环境，按照自己的思路进行指导；处理或解释死板（不能结合客户实际、主观；不能根据客户的具体情况和疑虑进行灵活解释；不善于使用资源；考虑问题不周，对关联业务判断不足，造成客户肯定会在后续问题。补充例证：未确认清楚企业问题，查客服系统发现过期就直接引导延期，此项将扣分。已经连上远程，企业并未要求，客服继续和企业保持通话。"
    deduction_weight: 1.0
