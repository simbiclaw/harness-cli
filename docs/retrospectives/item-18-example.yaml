    - facet_name: "customer_misconception_handling"
      enables_signals:
        - signal_id: "F4"
          extraction_shape: |
            F4 (未纠正客户错误认知) — 模型需要识别客户是否
            表达了与业务/产品事实不符的认知，以及坐席是否察觉
            并纠正。这是 minor failure：单次不致命但叠加降分。

      prompt: |
        你是一个质检分析助手。以下是坐席和客户的完整对话。

        ## 任务
        识别客户是否表达了与数字证书业务/产品事实不符的认知，
        以及坐席是否进行了纠正。

        ## 常见错误认知类型
        - "证书有存储功能" / "证书里存了我的资料"
        - "年检就是年报" / "工商局发的证"
        - "证书可以多台电脑同时用"（主证书不行，子证书可以）
        - "证书密码不用管，系统会记住"
        - "USB-KEY就是U盘"
        - "证书过期就是作废了"（可以续期）

        ## 检查要点
        1. 客户是否说出了上述类型或类似的错误认知？
        2. 坐席是否察觉？
        3. 坐席是否进行了纠正？
        4. 纠正方式是正面引导（"实际上是..."）还是直接否定（"不是的"）？

        ## 注意
        坐席不纠正的错误认知会在客户心中固化，导致后续服务中
        产生更多误解。即使本次通话的问题不依赖这个认知，
        不纠正仍是一个遗漏。

        ## 输出格式
        ```json
        {
          "misconceptions_found": [
            {
              "customer_said": "我的证书里存了我的资料",
              "timestamp_ms": 45200,
              "is_correct": false,
              "correct_information": "证书本身不存储用户数据，它是一个加密身份凭证"
            }
          ],
          "agent_corrected": false,
          "correction_style": "ignored",
          "evidence": "客户在45秒处说'证书里存了我的资料'，坐席未回应这个说法，直接继续指导操作"
        }
        ```

        correction_style 可选值: "positive_reframe" | "direct_denial" | "ignored"

        ## 对话
        {full_dialogue}

      output_schema:
        misconceptions_found: "list[{customer_said, timestamp_ms, is_correct, correct_information}]"
        agent_corrected: bool
        correction_style: "positive_reframe | direct_denial | ignored"
        evidence: str