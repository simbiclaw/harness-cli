    title: "非工作时间加急处理"
    content: "现在是非工作时间...您非工作时间处理问题的话，我这边给您开通有偿加急处理服务...异常类加急服务费用是100元/次"
    note: "仅引用话术 7 中的加急服务部分，不含工作时间告知"

  - id: "S8"
    product: "平台代注册"
    title: "平台代注册服务"
    content: "您好，我们可以为您提供平台代注册服务，请提供（……）"

  - id: "S9"
    product: "商品上架"
    title: "商品上架VIP服务"
    content: "您好，我们主要负责CA证书服务，您提及的商品上架服务属于VIP服务内容，会产生服务费。若您确实需要我们提供商品上架服务，我们会根据您平台/卖场及商品上架的数量定价，一般300元起步。建议您可以先自行学习一下，若真的有需要我们再一对一安排老师指导。"

