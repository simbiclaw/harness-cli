# 营销触发 — 权威关键词列表
#
# 编制方法:
#   1. 以 营销话术.md 的 18 个话术为权威源 —— 话术定义了实际存在的产品和服务。
#   2. 从每个话术的内容反推"什么客户场景会触发这个话术"。
#   3. 以 营销触发.md 的两套关键词 (T001-T005, VAS-001-VAS-005) 为候选池，
#      取覆盖对应话术触发场景的关键词。
#   4. rubric_com_hotline.md Items 20/21 中明确但无对应话术的场景，
#      单独标记为 coverage_gap。
#
# 排除的话术（非营销类——自我介绍/身份声明，不作 trigger）:
#   话术 1, 13, 14: 坐席身份与服务范围介绍，不是响应客户场景的营销话术。
#
# 来源: 营销话术.md (权威) · 营销触发.md (关键词候选池) · rubric_com_hotline.md (补全)
# 编制日期: 2026-07-16

triggers:

  # ══════════════════════════════════════════════════════════════════════
  # T01 — 子证书推荐
  # 话术 2: "查询到您公司已有一张母证书在使用，若您单位多人需要用证书，
  #         可以考虑再申领一张子证书。子证书功能与母证书一致...交错使用。"
  # ══════════════════════════════════════════════════════════════════════
  T01:
    script_ref: "营销话术 2"
    product: "子证书"
    scenario: "客户表达了多人使用、投标与年报冲突、或只有一个证书的需求"
    trigger_keywords:
      - "多人使用"
      - "多台电脑用"
      - "一个人用不了"
      - "投标和年报冲突"
      - "只有一个证书"
    # 来自 T001 (全部), VAS-005 子集
    rubric_scenarios:
      - "客户表达了只有一个证书可以招投标使用的情况"
      - "客户表达了年报要用证书，或者政务网要用证书等多认使用的情况"

  # ══════════════════════════════════════════════════════════════════════
  # T02 — 移动证书推荐
  # 话术 3: "查询到您公司的证书是介质证书，并且申领的时间也比较久了。
  #         介质可能随着时间会老化，而且需要电脑安装对应驱动...
  #         移动证书是经办人手机扫码后就能登录，操作更加方便。"
  # ══════════════════════════════════════════════════════════════════════
  T02:
    script_ref: "营销话术 3"
    product: "移动证书"
    scenario: "客户使用介质证书/旧版KEY，或咨询解锁、密码忘记，或表达USB不便"
    trigger_keywords:
      - "介质证书"
      - "旧版KEY"
      - "老KEY"
      - "证书老化"
      - "驱动装不上"
      - "电脑才能用"
      - "证书解锁"
      - "密码忘记"
      - "忘记密码"
      - "U盘"
      - "握奇"
      - "飞天"
      - "解锁"
      - "KEY.*不能用"
      - "KEY.*无法"
    # 来自 T002 (全部), VAS-005 子集，rubric 补充 "握奇""飞天""U盘"
    rubric_scenarios:
      - "企业介质KEY无法使用，或是旧版KEY如握奇飞天，来咨询办理介质证书"
      - "客户办理证书解锁业务"
      - "证书密码忘记引导解锁或办理移动证书"

  # ══════════════════════════════════════════════════════════════════════
  # T03 — 印章定制
  # 话术 5: "目前ca里赠送的是不带数字的简易公章，目前电子标基本都会要求
  #         电子章和实物章保持一致的。如果您的公章跟我们自带的不一样，
  #         建议还是另外定制"
  # 话术 1 中有印章定制服务介绍（仅作参考——话术 1 本身是 intro）
  # ══════════════════════════════════════════════════════════════════════
  T03:
    script_ref: "营销话术 5 (主), 话术 1 (印章定制部分)"
    product: "印章定制服务"
    scenario: "客户提及公章、法人章、签字章、电子签章相关需求，或公章与CA自带章不一致"
    trigger_keywords:
      - "电子章"
      - "法人章"
      - "签字章"
      - "手写签名"
      - "公章不一致"
      - "不带数字的公章"
      - "简易公章"
      - "实物章"
      - "电子签名"
      - "印章"
      - "盖章"
      - "定制.*章"
    # 合并 T003 + VAS-004，去重

  # ══════════════════════════════════════════════════════════════════════
  # T04 — 标书代写
  # 话术 4: "政采云投标都是电子标，做标书是在政采云客户端上制作，
  #         第六步电子签名环节会需要电子签章...建议提前定制哦"
  # 话术 11: "请问您是寻求标书代写服务，还是对于标书制作的流程存在疑问？"
  # 话术 12: "一般主标2千至5、6千不等..."
  # 话术 17: "您有制标书需求，可以发我手机号码..."
  # ══════════════════════════════════════════════════════════════════════
  T04:
    script_ref: "营销话术 4, 11, 12, 17"
    product: "标书代写服务"
    scenario: "客户提及做标书、投标、标书制作困难、不会做标书"
    trigger_keywords:
      - "做标书"
      - "标书制作"
      - "不会做标书"
      - "制标书"
      - "标书要投"
      - "标书"
      - "投标"
      - "代写"
      - "电子保函"
      - "政采云.*制作"
    # 合并 T004 + VAS-001，去重
    rubric_scenarios:
      - "客户表达了只有一个证书可以招投标使用的情况"

  # ══════════════════════════════════════════════════════════════════════
  # T05 — VIP 服务套餐
  # 话术 6: "您提及的内容属于我们VIP服务内容，你可以购买VIP服务包
  #         （供应商入驻、协助项目开标解密、商品上架、标书代写和电子保函等）"
  # ══════════════════════════════════════════════════════════════════════
  T05:
    script_ref: "营销话术 6"
    product: "VIP服务套餐"
    scenario: "客户提及CA标准服务范围外的需求（入驻、开标解密等）"
    trigger_keywords:
      - "入驻"
      - "供应商入驻"
      - "平台入驻"
      - "协议签署"
      - "协助开标"
      - "开标解密"
      - "VIP服务"
      - "商品上架"
    # 合并 T005 子集 + VAS-002

  # ══════════════════════════════════════════════════════════════════════
  # T06 — 商品上架服务
  # 话术 9: "您提及的商品上架服务属于VIP服务内容，会产生服务费...
  #         一般300元起步"
  # 话术 10: 服务模式与报价信息收集
  # 话术 15: "另外平台【商品上架，平台入驻？】，标书代写，电子保函等服务"
  # 话术 16: "协助商品代上架成功后，会产生服务费用，800元/次"
  # ══════════════════════════════════════════════════════════════════════
  T06:
    script_ref: "营销话术 9, 10, 15, 16"
    product: "商品上架服务"
    scenario: "客户需要商品上架但不知道怎么操作，或询问上架流程和费用"
    trigger_keywords:
      - "商品上架"
      - "上架"
      - "怎么.*上架"
      - "上架.*怎么"
      - "卖场"
      - "网上超市"
      - "框架协议"

  # ══════════════════════════════════════════════════════════════════════
  # T07 — 非工作时间加急
  # 话术 7: "现在是非法工作时间...您非工作时间处理问题的话，
  #         我这边给您开通有偿加急处理服务...异常类加急服务费用是100元/次"
  # ══════════════════════════════════════════════════════════════════════
  T07:
    script_ref: "营销话术 7"
    product: "加急处理服务 (100元/次)"
    scenario: "客户在非工作时间来电且有急迫需求"
    trigger_keywords:
      - "急"
      - "加急"
      - "能不能快点"
      - "今天就要"
      - "马上要"
      - "很着急"
      - "非工作时间"
      - "加班"
    # 两套关键词中都无此 trigger —— 从话术 7 内容反推

  # ══════════════════════════════════════════════════════════════════════
  # T08 — 平台代注册
  # 话术 8: "您好，我们可以为您提供平台代注册服务，请提供..."
  # ══════════════════════════════════════════════════════════════════════
  T08:
    script_ref: "营销话术 8"
    product: "平台代注册服务"
    scenario: "客户需要注册平台但不知道怎么操作"
    trigger_keywords:
      - "注册"
      - "不知道怎么注册"
      - "平台.*注册"
      - "注册.*平台"
      - "代注册"

  # ══════════════════════════════════════════════════════════════════════
  # T09 — VIP 精细化指导
  # 话术 18: "若还是不明白，我们也可提供VIP精细化服务指导，
  #          流程指导价300元/次"
  # ══════════════════════════════════════════════════════════════════════
  T09:
    script_ref: "营销话术 18"
    product: "VIP精细化服务指导 (300元/次)"
    scenario: "客户经过指导后仍表示不明白、觉得太复杂、或请求坐席代为操作"
    trigger_keywords:
      - "还是不明白"
      - "太复杂了"
      - "你能不能帮我弄"
      - "听不懂"
      - "不会操作"
      - "帮我操作"
      - "不会弄"
      - "复杂"
      - "能不能帮我"
    # VAS-003 的全部关键词 + 补充

  # ══════════════════════════════════════════════════════════════════════
  # T10 — 证书使用场景引导
  # (无独立话术——坐席引导客户从普通方式切换到证书方式)
  #
  # rubric Item 20, 1分标准:
  #   "客服在获悉客户以电子营业执照登录年报、政务网等，主动向其引导推介数字证书"
  # rubric Item 20, 0分标准:
  #   "在获悉了客户以普通方式登录年报、政务网等，客服没有引导企业用证书操作年报"
  # ══════════════════════════════════════════════════════════════════════
  T10:
    script_ref: "(无特定话术——引导至证书使用或子证书/移动证书推荐)"
    product: "数字证书使用引导"
    scenario: "客户使用普通方式（非证书）登录年报或政务网，存在引导至证书使用的机会"
    trigger_keywords:
      - "年报"
      - "政务网"
      - "普通方式.*登录"
      - "营业执照.*登录"
      - "电子营业执照"
      - "没有.*证书"
      - "不用.*证书"
      - "忘记.*密码.*登录"
    # rubic 明确但原两套关键词都缺失
    rubric_scenarios:
      - "客户表达了年报要用证书，或者政务网要用证书等多认使用的情况"
      - "在获悉了客户以普通方式登录年报、政务网等"
    note: "无独立话术——引导成功后复用 T01/T02 的话术"

  # ══════════════════════════════════════════════════════════════════════
  # T11 — 证书到期/年费
  # (无独立话术——坐席引导续期 + 视情况推荐移动证书)
  #
  # rubric Item 20, 0分标准:
  #   "企业来电咨询子证书和个体户证书年费内证书到期问题的，
  #    客服未正向引导，例如直接告知不需收费之类的"
  # ══════════════════════════════════════════════════════════════════════
  T11:
    script_ref: "(引导续期——无独立营销话术；续期后可复用 T02 移动证书推荐)"
    product: "证书续期 / 移动证书升级"
    scenario: "客户证书即将到期或已过期，存在续期 + 升级至移动证书的联合机会"
    trigger_keywords:
      - "证书到期"
      - "到期"
      - "年费"
      - "续期"
      - "续费"
      - "过期"
      - "快.*到期"
      - "到期.*怎么办"
    # rubic 明确但原两套关键词都缺失
    rubric_scenarios:
      - "企业来电咨询子证书和个体户证书年费内证书到期问题的"

# ══════════════════════════════════════════════════════════════════════════
# Coverage gaps: rubic 场景有对应话术但无对应 trigger 关键词的场景
# ══════════════════════════════════════════════════════════════════════════
coverage_gaps:
  - gap_id: "G01"
    rubric_scenario: "客户办理移动证书业务，客服向其引导了授权领证"
    issue: "客户主动办理移动证书时，应引导授权领证——但'客户主动办理'不是 trigger 关键词（关键词是坐席面临的问题场景）。这个场景需要不同的检测逻辑：识别客户正在办理移动证书，然后检查坐席是否引导了授权领证。"
    recommendation: "增加 transaction_type_detection facet：如果通话的业务类型是'办理移动证书'，则 T01/T02 的 trigger 逻辑不适用——改为检查坐席是否提及'授权领证'"

  - gap_id: "G02"
    rubric_scenario: "部门规定的营销节点正确引导（一般只考虑到一级营销即可）"
    issue: "'部门规定的营销节点'是一个外部日历/策略配置，不在 call transcript 中。编译器无法从 rubric 文本中提取具体的节点定义。"
    recommendation: "标记为 data_dependency —— 需要外部的营销节点日历配置文件。在配置文件接入前，此场景不触发 0 分处罚（无法判定'应该引导但未引导'）。"

# ══════════════════════════════════════════════════════════════════════════
# 营销话术脚本集（供 Item 21 P33 使用）
#
# 只含营销响应类话术。排除:
#   话术 1, 13, 14 — 坐席自我介绍/身份声明（不是针对客户场景的营销响应）
#   话术 7 前半 — 工作时间告知（非营销）；后半加急服务已作为 T07 trigger
# ══════════════════════════════════════════════════════════════════════════
marketing_scripts:
  - id: "S2"
    product: "子证书"
    title: "子证书推荐"
    content: "您好，查询到您公司已有一张母证书在使用，若您单位多人需要用证书，可以考虑再申领一张子证书。子证书功能与母证书一致，若您将母证书补办走，对应人员的证书会失效，造成工作不便，所以可以考虑多申领一张，交错使用。"

  - id: "S3"
    product: "移动证书"
    title: "移动证书推荐"
    content: "您好，查询到您公司的证书是介质证书，并且申领的时间也比较久了。介质可能随着时间会老化，而且需要电脑安装对应驱动，读取到才能使用。移动证书是经办人手机扫码后就能登录，操作更加方便。"

  - id: "S4"
    product: "标书代写"
    title: "标书代写引导"
    content: "您好，政采云投标都是电子标，做标书是在政采云客户端上制作，第六步电子签名环节会需要电子签章，签完章后才能生成加密标书。若您近期有标书要投，建议提前定制哦"

  - id: "S5"
    product: "印章定制"
    title: "印章定制推荐"
    content: "目前ca里赠送的是不带数字的简易公章，目前电子标基本都会要求电子章和实物章保持一致的。如果您的公章跟我们自带的不一样，建议还是另外定制"

  - id: "S6"
    product: "VIP服务套餐"
    title: "VIP服务套餐介绍"
    content: "您好，我们目前负责CA使用流程指导、印章定制服务，您提及的内容属于我们VIP服务内容，你可以购买VIP服务包（供应商入驻、协助项目开标解密、商品上架、标书代写和电子保函等）"

  - id: "S7m"
