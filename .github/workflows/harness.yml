name: Harness

on:
  pull_request:
  push:
    branches: [main]

jobs:
  structural-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for test_commit_messages.py.
      - uses: astral-sh/setup-uv@v3
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install deps
        run: uv sync --extra dev
      - name: Run structural tests
        run: uv run pytest .claude/tests/ -v

  application-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - name: Run application tests
        run: uv run pytest tests/ -v --cov

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - run: uv run mypy src/

  layering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - run: uv run lint-imports

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  harness-go-scaffolding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert harness-go scaffolding is torn down
        run: |
          if grep -q 'harness-spine-bootstrap' CLAUDE.md; then
            echo "ERROR: harness-spine-bootstrap sentinel found in CLAUDE.md on main."
            echo "Run harness-go Step 5 to remove it."
            exit 1
          fi
          if [ -f docs/MAP.md ]; then
            echo "ERROR: docs/MAP.md exists on main. Bootstrap scaffolding was not torn down."
            echo "Run harness-go Step 5 to delete it."
            exit 1
          fi
