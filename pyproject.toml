[project]
name = "argus"
version = "0.0.0"
description = "Transform QA from passive sampling into a 100% full-coverage proactive intelligence center. CLI tool built end-to-end by Claude Code."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "simbiclaw" }]

# Direct dependencies. Every entry below MUST have a matching dep-vet record
# at docs/decisions/dep-vet-<name>.md and a Decision Log entry in some
# ExecPlan. Enforced by .claude/tests/test_dep_decisions.py.
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "anthropic>=0.30",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
# The local proposer's serving stack (9010 D21, swapped to llama.cpp).
# Lazily imported by src/argus/io/local_proposer.py; only installs that run
# the real model need it. Dep-vet: docs/decisions/dep-vet-llama-cpp-python.md
proposer = [
    "llama-cpp-python>=0.3",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "pre-commit>=3.7",
    "numpy>=2.0",
]

[project.scripts]
argus = "argus.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

# ---------------------------------------------------------------------------
# Ruff: linter + formatter. Replaces black, isort, flake8, pylint.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude/", "docs/experiments/"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle, pyflakes
    "I",                # isort
    "B",                # flake8-bugbear
    "C4",               # flake8-comprehensions
    "UP",               # pyupgrade
    "SIM",              # flake8-simplify
    "RUF",              # ruff-specific
    "ANN",              # flake8-annotations (force type hints)
    "S",                # flake8-bandit (basic security)
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101", "RUF001", "S105", "S106", "E501", "S603", "S607", "B017"]
".claude/tests/**" = ["ANN", "S101", "S603", "S607"]
"tools/lint/tests/**" = ["ANN", "S101", "S603"]
"scripts/**" = ["S310", "RUF001", "E501"]
"src/argus/types/**" = ["RUF003", "RUF001", "UP042", "S105"]
"src/argus/config/**" = ["RUF003", "RUF001", "S106"]
"src/argus/io/**" = ["RUF001", "RUF002", "RUF003", "ANN"]
"src/argus/core/**" = ["RUF001", "RUF002", "RUF003", "RUF012", "RUF013", "RUF059", "ANN", "E741", "B034", "B905", "SIM102", "C401"]
"src/argus/cli/**" = ["RUF001", "ANN", "E501"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Mypy: strict type checking on src/, lighter on tests.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
exclude = ["docs/experiments/", "build/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "argus.core.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "argus.io.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "argus.cli.*"
ignore_errors = true

# ---------------------------------------------------------------------------
# Pytest: collect both application tests and harness structural tests.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests", ".claude/tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
asyncio_mode = "auto"
markers = [
    "asyncio: mark a test as an async test",
]

[tool.coverage.run]
source = ["src/argus"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
]
