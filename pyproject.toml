[project]
name = "argus"
version = "0.0.0"
description = "Transform QA from passive sampling into a 100% full-coverage proactive intelligence center. CLI tool built end-to-end by Claude Code."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "simbiclaw" }]

# Direct dependencies. Every entry below MUST have a matching dep-vet record
# at docs/decisions/dep-vet-<name>.md and a Decision Log entry in some
# ExecPlan. Enforced by .claude/tests/test_dep_decisions.py.
dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "pre-commit>=3.7",
]

[project.scripts]
argus = "argus.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

# ---------------------------------------------------------------------------
# Ruff: linter + formatter. Replaces black, isort, flake8, pylint.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude/", "docs/experiments/"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle, pyflakes
    "I",                # isort
    "B",                # flake8-bugbear
    "C4",               # flake8-comprehensions
    "UP",               # pyupgrade
    "SIM",              # flake8-simplify
    "RUF",              # ruff-specific
    "ANN",              # flake8-annotations (force type hints)
    "S",                # flake8-bandit (basic security)
]
ignore = [
    "ANN101",  # Missing type for self
    "ANN102",  # Missing type for cls
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101"]
".claude/tests/**" = ["ANN", "S101", "S603", "S607"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Mypy: strict type checking on src/, lighter on tests.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
exclude = ["docs/experiments/", "build/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Pytest: collect both application tests and harness structural tests.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests", ".claude/tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["src/argus"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
